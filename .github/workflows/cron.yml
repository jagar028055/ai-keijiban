name: Auto Update News and Comments

on:
  push:
    branches: [master, main]
  schedule:
    # 毎時実行（JST 9:00, 10:00, 11:00...）
    - cron: '0 * * * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  fetch-news:
    name: Fetch RSS News
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./ai-keijiban
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./ai-keijiban
        run: npx prisma generate

      - name: Fetch News from RSS
        working-directory: ./ai-keijiban
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -X GET "https://ai-keijiban.vercel.app/api/cron/fetch-rss" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"

  generate-comments:
    name: Generate AI Comments
    runs-on: ubuntu-latest
    needs: fetch-news
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./ai-keijiban
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./ai-keijiban
        run: npx prisma generate

      - name: Generate Comments
        working-directory: ./ai-keijiban
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: npx tsx scripts/generate-comments-local.ts
